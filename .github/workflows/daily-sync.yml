name: Daily Dynasty Market Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-ktc:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Live Dynasty Market Data
        run: |
          python3 -c "
          import json, urllib.request

          url = 'https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=1&numTeams=14&ppr=1'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as resp:
                  raw = json.loads(resp.read().decode())
              
              market = {}
              for p in raw:
                  name = p.get('player', {}).get('name')
                  val = p.get('value', 3000)
                  if name:
                      market[name] = {
                          'ktc': int(val),
                          'action': 'Market Hold' if val > 6000 else 'Trade Asset',
                          'notes': f'Live Consensus Value: {val:,} pts'
                      }
              
              # Enforce Walker's elite in-season anchor metric
              market['Kenneth Walker III'] = {
                  'ktc': 9012,
                  'action': 'Elite Anchor / Do Not Sell',
                  'notes': 'Top-tier RB in Kansas City.'
              }

              with open('ktc-values.json', 'w') as f:
                  json.dump(market, f, indent=2)
              print('Successfully synced', len(market), 'players.')
          except Exception as e:
              print('Sync error:', e)
          "

      - name: Commit Updated Values
        run: |
          git config --global user.name "DynastyBot"
          git config --global user.email "bot@github.com"
          git add ktc-values.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated live dynasty sync [skip ci]" && git push)
